# Aurora CDP default configuration.
# Overlay order (later wins): defaults.yaml -> ./aurora.yaml (optional) -> .aurora/last_best.yaml (tuner output)
# Values annotated [AMP] mirror documented Amperity defaults (docs/research/*). Values annotated
# [ASSUMPTION] are our own and are listed in docs/feature-parity.md.

workspace: .aurora            # local state: DuckDB file, run history, demo data
outputs_dir: outputs          # exports, reports
db_file: aurora.duckdb        # relative to workspace

normalize:
  default_region: US          # phonenumbers region for national-format numbers
  phone_use_last10_for_match: true   # [AMP] identity resolution uses only the last 10 digits
  email_strip_plus_tag: true         # [AMP] derek+1234@ -> derek@
  email_strip_gmail_dots: false      # [ASSUMPTION] optional gmail-style dot folding; default off
  nickname_file: null                # CSV (nickname,canonical) merged over the built-in table [AMP: stitch_nicknames]
  address_parsing: false             # [AMP] unit/suite + PO Box + compound directionals parsed into a canonical form;
                                     # off by default because it changes address_norm (re-tune after enabling)
  email_junk_local_parts:            # [AMP] junk local-part patterns are NULLed for matching (quoted: YAML 1.1 reads no/none as booleans)
    - "test"
    - "no"
    - "none"
    - "reservation"
    - "admin"
    - "contact"
    - "guest"
    - "info"
    - "noreply"
    - "no-reply"
    - "donotreply"
    - "unknown"
  address_abbreviations:             # [AMP] expand common abbreviations, strip punctuation, uppercase
    ST: STREET
    AVE: AVENUE
    RD: ROAD
    BLVD: BOULEVARD
    DR: DRIVE
    LN: LANE
    CT: COURT
    STE: SUITE
    APT: APARTMENT
    N: NORTH
    S: SOUTH
    E: EAST
    W: WEST
    "1ST": FIRST
    "2ND": SECOND
    "3RD": THIRD

blocklist:
  # [AMP] automatic bad-value detection thresholds: a value linked to more than N distinct names is ignored
  email_max_given_names: 20
  email_max_surnames: 20
  phone_max_given_names: 20
  address_max_given_names: 40

blocking:
  # [AMP] documents a blocking size limit of 100 (1000 for foreign keys) above which a block is *skipped*.
  # We never discard a block: a block over the limit is "oversized" and is still compared, see docs/tuning.md.
  block_size_limit: 100         # blocks above this are oversized -> handled by the rules below, never dropped
  fk_block_size_limit: 1000     # same for fk-* strategies
  max_pairs_per_block: 500000   # [ASSUMPTION] an oversized block whose n*(n-1)/2 fits this budget is compared in full
  refine_target: 100            # sub-blocks are refined until they are at most this big (or keys run out)
  sn_window: 25                 # sorted-neighbourhood window swept over every refined oversized block (cross-sub-block recall)
  collapse_trivial_dupes: true  # [AMP] trivial dupe groups: identical records are blocked/scored once via a representative
  persist_blocking_keys: true   # write stitch_blocking_keys (QA); costs ~1 row per record per strategy
  strategy_source: fixed        # fixed | learned | union  (learned = DNF strategies from learned_strategies_file)
  learned_strategies_file: null # YAML written by `tools/learn_dnf.py` ({strategies: [...]})
  learned_keep_types: [ck, loy_id, fk]   # fixed key strategies kept even in `learned` mode
  dnf:                          # learned DNF blocking (Bilenko et al. 2006); see stitch/dnf.py
    max_terms: 2                # conjunction length
    min_positive_pairs: 200     # fewer labelled/self-labelled positives -> fall back to the fixed strategies
    min_predicate_pc: 0.01      # unary predicates covering fewer positives are pruned
    target_pc: 0.95             # stop when this share of positives is covered
    min_gain_pairs: 5           # a conjunction must cover at least this many new positives to be added
    pairs_per_record_budget: 20 # candidate-pair budget on the sample = this x sample size
    sample_records: 20000       # record sample used to measure cost / completeness
    sample_positive_pairs: 5000
    sample_seed: 0              # sampling seed (documented; learning is otherwise deterministic)
    labels: self                # self (deterministic rules) | truth (evaluation corpora with an entity label)
  refine_keys:                  # secondary keys tried, in order, when a block of this strategy type is oversized
    email:          [name3, postal, birthdate, update_month, given3]
    phone:          [name3, postal, birthdate, update_month, given3]
    name_postal:    [email, phone, birthdate, house_number, update_month]
    name_birthdate: [email, phone, postal, house_number, update_month]
    name:           [postal, birthdate, email, phone, house_number, update_month]
    loy_id:         [name3, postal, birthdate, update_month]
    ck:             [name3, postal, birthdate, update_month]
    fk:             [name3, postal, birthdate, update_month]
    dnf:            [postal, birthdate, email, phone, name3, update_month]
  strategies:                   # each strategy maps a record to zero or more blocking keys
    - name: email_exact
      type: email
    - name: phone_exact
      type: phone
    - name: name_postal
      type: name_postal         # first3(given_name) + surname + postal   [AMP]
    - name: name_birthdate
      type: name_birthdate      # first3(given_name) + first(surname) + birthdate  [AMP]
    - name: name
      type: name                # first3(given_name) + first3(surname): the only key records with nothing but a
      max_pairs_per_block: 50000   # name can share [ASSUMPTION]; common names are refined, not compared in full
    - name: loy_id_exact
      type: loy_id              # loyalty id exact (key-only matches must still be blocked together)
    - name: ck_exact
      type: ck                  # customer key exact (one-to-one / deterministic stitch)
    - name: fk
      type: fk                  # one strategy per fk-<namespace>; exact match on the key

matcher:
  match_threshold: 3.0          # [AMP] default pairwise scoring threshold is 3.0 on a 0-5 scale
  score_chunk_size: 250000      # candidate pairs scored per chunk (bounds memory; results are chunk-invariant)
  persist_features: false       # keep per-pair features_json in stitch_scores (QA; large: ~300 B per pair)
  export_expanded_dupe_pairs: true   # expand collapsed trivial-dupe groups back into every member pair in stitch_scores
  max_expanded_pairs: 50000000  # safety cap on that expansion (exceeding it is reported in metrics, never silent)
  # Ordered deterministic rules (first match wins) applied before probabilistic scoring. [AMP: Rules Editor]
  deterministic:
    ck_exact_score: 5.0
    loy_exact_score: 5.0
    email_exact_with_name_score: 4.5
    phone_exact_with_name_score: 4.2
    name_agreement_min: 0.85    # given+surname similarity needed for the "with_name" rules
  # Probabilistic model: score = 5 * sigmoid(bias + sum(w_i * f_i)). Weights are hand-set for the scaffold
  # [ASSUMPTION]; Amperity uses a learned ordinal-regression classifier.
  weights:
    bias: -2.5
    given_sim: 1.0
    surname_sim: 1.2
    email_exact: 3.0
    email_sim: 0.5              # applied only above email_sim_min (typo-level similarity), scaled 0..1
    email_sim_min: 0.92
    phone_exact: 2.5
    address_sim: 1.2            # centred: contributes w*(2*sim-1), so dissimilar addresses count against a match
    postal_exact: 0.6
    birthdate_exact: 1.5
    fk_shared: 1.0
    name_mismatch_penalty: -1.5
    name_mismatch_floor: 0.6    # [ASSUMPTION] given/surname similarity below this triggers the penalty
    address_house_number_mismatch_cap: 0.3   # [ASSUMPTION] address similarity cap when house numbers differ
    birthdate_conflict: -3.0
  hard_conflicts:
    birthdate: true             # [AMP] birthdate is the canonical hard conflict
    birthdate_typo_tolerance: 2 # Levenshtein distance treated as a typo rather than a conflict [ASSUMPTION]

cluster:
  supersized_min_size: 500      # [AMP] (docs inconsistent: 64 vs 500); BFS partition above this size
  conflict_attributes: [birthdate]

storage:
  duckdb:
    memory_limit: 3GB           # DuckDB buffer-pool cap; joins/sorts spill to temp_directory beyond it
    threads: 4
    temp_directory: null        # null -> <workspace>/duckdb_tmp
    preserve_insertion_order: false

stable_id:
  enabled: true
  jitter_alert_pct: 2.0         # [AMP] alert when >=2% of records change ID between runs

survivorship:
  # [AMP] Source_Priority: lower number wins; unassigned -> 999. Field_Priority overrides per attribute.
  source_priority:
    loyalty: 1
    crm: 2
    ecommerce: 3
    pos: 4
  field_priority: {}            # e.g. email: {ecommerce: 1}
  recency_field: update_dt      # [AMP] update-dt semantic enables recency-aware survivorship
  attributes: [given_name, surname, email, phone, address, address2, city, state, postal, country, birthdate]

sources: {}                     # per-source semantic mappings; the demo registers its own (see demo.py)

tuning:
  thresholds: [2.0, 2.5, 3.0, 3.5, 4.0]
  min_precision: 0.98         # [ASSUMPTION] only thresholds meeting this pairwise precision compete on F1 (false merges are
                              # costlier than misses in a CDP); if none meet it, all compete
